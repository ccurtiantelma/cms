info:
  name: Mark Read
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/app/notifications/:guid/read"
  params:
    - name: guid
      value: 0123456789abcdef
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
