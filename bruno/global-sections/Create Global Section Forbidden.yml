info:
  name: Create Global Section Forbidden
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/app/global-sections"
  body:
    type: json
    data: |-
      {
        "title": "Tentativo non autorizzato",
        "content": { "version": 1, "blocks": [] }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `{{token}}` in questa richiesta deve essere di un `User` (30, sotto la
  soglia `Manager` di `GuardManager`): nessuna ownership per riga su questo
  modulo (a differenza delle Pagine), soglia unica RBAC.

tests: |-
  test("status is 401 (nessun token) o 403 (ruolo insufficiente)", function() {
    expect([401, 403]).to.include(res.getStatus());
  });
