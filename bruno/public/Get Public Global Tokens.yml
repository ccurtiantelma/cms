info:
  name: Get Public Global Tokens
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/public/settings/global-tokens"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200 (sempre: fallback ai default di fabbrica se non salvati)", function() {
    expect(res.getStatus()).to.equal(200);
  });

  test("nessun JWT richiesto: endpoint escluso dal middleware auth", function() {
    // Nessuna Authorization inviata in questa richiesta: se il middleware
    // auth non fosse escluso, ci si aspetterebbe 401, mai qui.
    expect(res.getStatus()).to.not.equal(401);
    expect(res.getStatus()).to.not.equal(403);
  });

  test("espone i Global Design Tokens (version/palette/typography/spacing)", function() {
    const body = res.getBody();
    expect(body).to.have.property("version");
    expect(body).to.have.property("palette");
    expect(body).to.have.property("typography");
    expect(body).to.have.property("spacing");
  });
