info:
  name: Get Page
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/public/pages?path=/chi-siamo"
  params:
    - name: path
      value: /chi-siamo
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0

tests: |-
  test("status is 200 (pubblicata), 308 (non canonico) o 404 (non pubblicata/inesistente)", function() {
    expect([200, 308, 404]).to.include(res.getStatus());
  });

  test("su successo espone solo campi pubblici (mai guid/id/status/version amministrativi)", function() {
    if (res.getStatus() === 200) {
      const body = res.getBody();
      expect(body).to.have.property("title");
      expect(body).to.have.property("slug");
      expect(body).to.have.property("locale");
      expect(body).to.have.property("content");
      expect(body).to.have.property("seo");
      expect(body).to.not.have.property("guid");
      expect(body).to.not.have.property("id");
      expect(body).to.not.have.property("status");
      expect(body).to.not.have.property("draftContent");
    }
  });

  test("su 308 il redirect punta alla stessa risorsa in forma canonica, nessun 403 in nessun caso", function() {
    if (res.getStatus() === 308) {
      expect(res.getHeader("location")).to.include("/api/v1/public/pages?path=");
    }
    expect(res.getStatus()).to.not.equal(403);
  });

  test("nessun JWT richiesto: endpoint escluso dal middleware auth", function() {
    // Nessuna Authorization inviata in questa richiesta: se il middleware
    // auth non fosse escluso, ci si aspetterebbe 401, mai qui.
    expect(res.getStatus()).to.not.equal(401);
  });
