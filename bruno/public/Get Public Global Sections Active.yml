info:
  name: Get Public Global Sections Active
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/public/global-sections/active"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ADR-55: legge sempre dal database, nessuna cache Redis pubblica dietro le
  quinte (`PublicGlobalSectionsCacheService` eliminato). Sempre `200`: uno
  slot senza Sezione assegnata è `null`, mai un errore.

tests: |-
  test("status is 200 (sempre)", function() {
    expect(res.getStatus()).to.equal(200);
  });

  test("nessun JWT richiesto: endpoint escluso dal middleware auth", function() {
    expect(res.getStatus()).to.not.equal(401);
    expect(res.getStatus()).to.not.equal(403);
  });

  test("espone header/footer (null se lo slot non ha una Sezione assegnata)", function() {
    const body = res.getBody();
    expect(body).to.have.property("header");
    expect(body).to.have.property("footer");
  });
