info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200 (ok) or 503 (degraded)", function() {
    expect(res.getStatus()).to.be.oneOf([200, 503]);
  });

  test("checks database/redis/bullmq presenti nella risposta", function() {
    const body = res.getBody();
    const details = body.details || body.message?.details;
    expect(details).to.have.all.keys("database", "redis", "bullmq");
  });
