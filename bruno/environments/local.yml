name: local
variables:
  - name: baseUrl
    value: http://localhost:3000/api/v1
  # Fuori dal prefisso api/v1 (convenzione Prometheus): usato solo da bruno/metrics/*.yml (ADR-15).
  - name: serverUrl
    value: http://localhost:3000
  - name: token
    value: ""
  - name: tmpToken
    value: ""
  - name: fileGuid
    value: ""
  # guid di un file con entity="page-media" (ADR-27): da valorizzare a mano dopo
  # aver associato un'immagine a un blocco `image` — bruno/media/*.yml non ne crea uno da sé.
  - name: mediaGuid
    value: ""
