info:
  name: Delete File
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/app/files/{{fileGuid}}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 204, 403 (non autore/non Admin) o 404 (già eliminato)", function() {
    expect(res.getStatus()).to.be.oneOf([204, 403, 404]);
  });
