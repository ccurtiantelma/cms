info:
  name: Download File
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/app/files/{{fileGuid}}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200 or 404 (se {{fileGuid}} non è ancora stato valorizzato da un upload)", function() {
    expect(res.getStatus()).to.be.oneOf([200, 404]);
  });
