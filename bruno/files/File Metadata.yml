info:
  name: File Metadata
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/app/files/{{fileGuid}}/metadata"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200 o 404 (se {{fileGuid}} non è ancora stato valorizzato da un upload)", function() {
    expect(res.getStatus()).to.be.oneOf([200, 404]);
  });

  test("se 200, risposta contiene solo i campi pubblici (mai storageKey/checksumSha256)", function() {
    if (res.getStatus() !== 200) return;
    const body = res.getBody();
    expect(body).to.have.all.keys("guid", "originalName", "mimeType", "sizeBytes", "entity", "entityId", "width", "height", "url", "createdAt");
  });
