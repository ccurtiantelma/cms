info:
  name: Upload File
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/app/files"
  body:
    type: multipartForm
    data:
      - name: file
        type: file
        value:
          - /path/to/local/file.pdf
      - name: entity
        type: text
        value: invoice
      - name: entityId
        type: text
        value: inv-1
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 201 o 403 (media:upload mancante: utente disattivato)", function() {
    expect(res.getStatus()).to.be.oneOf([201, 403]);
  });

  test("se 403, messaggio del permesso media:upload (SPEC-RBAC-F2c)", function() {
    if (res.getStatus() !== 403) return;
    expect(res.getBody().message).to.equal("Permessi insufficienti (richiesto permesso: media:upload).");
  });

  test("risposta contiene i metadata pubblici, mai storageKey/checksum", function() {
    if (res.getStatus() !== 201) return;
    const body = res.getBody();
    expect(body).to.have.all.keys(
      "guid", "originalName", "mimeType", "sizeBytes", "entity", "entityId",
      "width", "height", "url", "focalX", "focalY", "createdAt"
    );
    expect(body).to.not.have.property("storageKey");
    expect(body).to.not.have.property("checksumSha256");
  });

  test("un allegato non editoriale non è raster: width/height restano null (RFC-F09 N2)", function() {
    if (res.getStatus() !== 201) return;
    const body = res.getBody();
    expect(body.width).to.equal(null);
    expect(body.height).to.equal(null);
    expect(body.url).to.equal(null);
  });
