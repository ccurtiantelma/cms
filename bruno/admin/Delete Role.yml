info:
  name: Delete Role
  type: http
  seq: 14

http:
  method: DELETE
  url: "{{baseUrl}}/app/admin/roles/:guid"
  params:
    - name: guid
      value: 0123456789abcdef
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 204, 403, 404 o 409 (ROLE_IN_USE)", function() {
    expect(res.getStatus()).to.be.oneOf([204, 403, 404, 409]);
  });
