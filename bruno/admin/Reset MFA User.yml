info:
  name: Reset MFA User
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/app/admin/users/:guid/reset-mfa"
  params:
    - name: guid
      value: 0123456789abcdef
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
