info:
  name: Update Role
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{baseUrl}}/app/admin/roles/:guid"
  params:
    - name: guid
      value: 0123456789abcdef
      type: path
  body:
    type: json
    data: |-
      {
        "name": "SEO Specialist",
        "permissionCodes": ["pages:create", "pages:edit_any"]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200, 403 (roles:manage mancante o ruolo di sistema) o 404", function() {
    expect(res.getStatus()).to.be.oneOf([200, 403, 404]);
  });
