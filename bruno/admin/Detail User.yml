info:
  name: Detail User
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/app/admin/users/:guid"
  params:
    - name: guid
      value: 0123456789abcdef
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
