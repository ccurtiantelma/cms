info:
  name: Rebuild Static Site
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/app/admin/system/rebuild-static-site"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 202 (SuperAdmin) o 403 (ruolo inferiore)", function() {
    expect(res.getStatus()).to.be.oneOf([202, 403]);
  });
