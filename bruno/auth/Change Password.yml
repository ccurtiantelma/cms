info:
  name: Change Password
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "Password123!",
        "newPassword": "NewPassword123!"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
