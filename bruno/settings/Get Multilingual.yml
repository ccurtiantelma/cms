info:
  name: Get Multilingual
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/app/settings/multilingual"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Registro dei Locale attivi (RFC-F05 § 1, M1 — firmato il 2026-08-25).
  Su un'installazione mai personalizzata risponde col bootstrap da
  `AppConstants.defaultLocale`.

tests: |-
  test("status is 200", function() {
    expect(res.getStatus()).to.equal(200);
  });

  test("active è non vuoto e contiene il Locale di default (ADR-24 § 5)", function() {
    const body = res.getBody();
    expect(body.active).to.be.an("array").that.is.not.empty;
    expect(body.active).to.include(body.default);
  });
