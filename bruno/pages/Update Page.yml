info:
  name: Update Page
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/app/pages/:guid"
  params:
    - name: guid
      value: a1b2c3d4e5f6a7b8
      type: path
  body:
    type: json
    data: |-
      {
        "version": 1,
        "title": "Chi siamo (aggiornato)"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200, 403, 404 or 409", function() {
    expect([200, 403, 404, 409]).to.include(res.getStatus());
  });

  test("un 409 porta un code distinto (PAGE_VERSION_CONFLICT o PAGE_SLUG_DUPLICATE)", function() {
    if (res.getStatus() === 409) {
      const body = res.getBody();
      expect(["PAGE_VERSION_CONFLICT", "PAGE_SLUG_DUPLICATE"]).to.include(body.code);
    }
  });
