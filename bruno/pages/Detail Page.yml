info:
  name: Detail Page
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/app/pages/:guid"
  params:
    - name: guid
      value: a1b2c3d4e5f6a7b8
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200 or 403 or 404", function() {
    expect([200, 403, 404]).to.include(res.getStatus());
  });

  test("su successo, contentIssues è sempre presente (array, anche vuoto — SPEC-F02-blocchi.md § 4.3)", function() {
    if (res.getStatus() === 200) {
      const body = res.getBody();
      expect(body).to.have.property("contentIssues");
      expect(body.contentIssues).to.be.an("array");
    }
  });
