info:
  name: Create Page - Container StyleWidth Range Valido (ADR-71)
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/app/pages"
  body:
    type: json
    data: |-
      {
        "title": "Pagina con container styleWidth dentro range (ADR-71)",
        "locale": "it-IT",
        "draftContent": {
          "version": 1,
          "blocks": [
            {
              "id": "b1",
              "type": "container",
              "v": 1,
              "props": { "styleWidth": { "value": 2000, "unit": "px" } },
              "children": []
            }
          ]
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 201 (container.styleWidth unitValue px, dentro [0,4000], ADR-71 § 3)", function() {
    expect(res.getStatus()).to.equal(201);
  });

  test("contentIssues è presente e vuoto su un albero integro (SPEC-F02-blocchi.md § 4.3)", function() {
    const body = res.getBody();
    expect(body).to.have.property("contentIssues");
    expect(body.contentIssues).to.deep.equal([]);
  });
