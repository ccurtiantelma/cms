info:
  name: Create Page - Tipo Blocco Sconosciuto
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/app/pages"
  body:
    type: json
    data: |-
      {
        "title": "Pagina con tipo di blocco sconosciuto",
        "locale": "it-IT",
        "draftContent": {
          "version": 1,
          "blocks": [
            {
              "id": "b1",
              "type": "carousel",
              "v": 1,
              "props": {},
              "children": []
            }
          ]
        }
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 400 (tipo fuori dai cinque approvati da ADR-21 § 5)", function() {
    expect(res.getStatus()).to.equal(400);
  });

  test("code BLOCK_TYPE_UNKNOWN con path del nodo colpevole, nessun elenco di tipi noti (SPEC-F02-blocchi.md § 4)", function() {
    const body = res.getBody();
    expect(body.code).to.equal("BLOCK_TYPE_UNKNOWN");
    expect(body.details).to.deep.equal({ path: "blocks[0]", type: "carousel" });
  });
