info:
  name: List Pages
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/app/pages?p=1&i=20"
  params:
    - name: p
      value: "1"
      type: query
    - name: i
      value: "20"
      type: query
    - name: q
      value: ""
      type: query
      disabled: true
    - name: o
      value: "updatedAt"
      type: query
      disabled: true
    - name: d
      value: "desc"
      type: query
      disabled: true
    - name: status
      value: "draft"
      type: query
      disabled: true
    - name: locale
      value: "it-IT"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests: |-
  test("status is 200", function() {
    expect(res.getStatus()).to.equal(200);
  });

  test("risposta è paginata", function() {
    const body = res.getBody();
    expect(body).to.have.all.keys("items", "totalItems", "totalPages", "currentPage", "itemsPerPage");
  });
