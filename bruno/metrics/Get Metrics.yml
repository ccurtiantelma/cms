info:
  name: Get Metrics
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/metrics"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ADR-15: endpoint opzionale, montato solo se METRICS_ENABLED=true (default
  false). Se disattivato risponde 404 (nessun MetricsModule registrato).
  Fuori dal prefisso api/v1 (convenzione Prometheus) e senza Authorization
  Bearer: uno scraper Prometheus non ha un JWT applicativo.

tests: |-
  test("status è 200 (abilitato) o 404 (METRICS_ENABLED=false, default)", function() {
    expect(res.getStatus()).to.be.oneOf([200, 404]);
  });

  test("se abilitato, Content-Type e corpo rispettano il formato Prometheus", function() {
    if (res.getStatus() !== 200) return;
    expect(res.getHeader("content-type")).to.include("text/plain");
    expect(res.getBody()).to.include("process_cpu_user_seconds_total");
  });
