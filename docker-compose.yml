# Configurazione docker-compose per lo sviluppo locale.
# Isola container, rete e volumi da altri stack Docker sulla stessa macchina.
version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI → http://localhost:8025

volumes:
  pgdata:
