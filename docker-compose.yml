# Nome esplicito del progetto Compose: isola container, rete e volumi da quelli
# degli altri stack docker presenti sulla stessa macchina, che usano gli stessi
# nomi di servizio (postgres/redis/mailhog).
name: cms

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1026:1025'   # SMTP
      - '8026:8025'   # Web UI → http://localhost:8026

volumes:
  pgdata:
