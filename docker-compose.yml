# Configurazione docker-compose per lo sviluppo locale.
# Isola container, rete e volumi da altri stack Docker sulla stessa macchina.
#
# Porte host non standard di proposito: questo progetto gira sempre in
# parallelo con altri stack sulla stessa macchina, quindi ogni porta
# pubblicata sull'host è spostata dal default noto del suo servizio
# (5432/6379/1025/8025) a un equivalente "5" + porta originale — il lato
# container resta il default di immagine, invariato: solo il mapping
# host:container cambia, mai cosa ascolta dentro il container.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - '51025:1025'   # SMTP
      - '58025:8025'   # Web UI → http://localhost:58025

  # Sito statico in locale (ADR-63, ADR-68): stessa conf di produzione, servita
  # su http://localhost:58080. Legge i file che il backend in sviluppo scrive in
  # app/backend/storage/static-site e scrive i log delle visite in
  # app/backend/storage/edge-logs, che il job del backend legge ogni 5 minuti.
  # Non in dist/: `nest start --watch` la svuota a ogni ricompilazione.
  nginx-static:
    image: nginx:1.27-alpine
    command: ['/bin/sh', '-c', "mkdir -p /var/log/edge && chmod 0777 /var/log/edge && exec nginx -g 'daemon off;'"]
    volumes:
      - ./app/backend/storage/static-site:/usr/share/nginx/html:ro
      - ./app/backend/storage/edge-logs:/var/log/edge
      - ./nginx/static-site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '58080:80'

volumes:
  pgdata:
