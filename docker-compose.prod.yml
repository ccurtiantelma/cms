# Compose di produzione — separato da docker-compose.yml (dev: solo servizi di
# supporto Postgres/Redis/Mailhog, app avviata via `npm run dev`). Qui invece
# anche backend e frontend girano come container, buildati dai rispettivi
# Dockerfile multi-stage (app/backend/Dockerfile, app/frontend/Dockerfile).
#
# Setup:
#   1. cp .env.example .env   (root, accanto a questo file) e compila i valori
#      reali (POSTGRES_PASSWORD, SECURITY_KEY, COOKIE_SECRET, SMTP_*, FRONTEND_URL
#      con l'URL pubblico reale, VITE_API_BASE_URL con l'URL pubblico dell'API,
#      PUBLIC_MEDIA_BASE_URL/VITE_PUBLIC_MEDIA_BASE_URL con l'URL pubblico reale
#      del backend — MAI un host Docker interno, un <img> nel browser non lo
#      raggiungerebbe).
#   2. docker compose -f docker-compose.prod.yml up -d --build
#
# Note:
# - Nessun mailhog: in produzione l'invio email usa SMTP reale (SMTP_HOST/PORT/
#   USER/PASS/FROM in .env), non un catcher locale.
# - DATABASE_URL/REDIS_URL vengono ricalcolate qui sotto (non lette da .env) per
#   puntare sempre ai nomi dei servizi Docker (postgres/redis) e restare in sync
#   con POSTGRES_USER/PASSWORD/DB — evita che le due config driftino.
# - TLS/dominio/reverse proxy sono intenzionalmente fuori scope: da mettere
#   davanti (Traefik/nginx/load balancer del provider) nell'ambiente di hosting.
# - postgres/redis non pubblicano porte sull'host: raggiungibili solo dagli
#   altri servizi sulla rete `mgmt_net`.
# - Air-gap (ADR-53 § 4, ADR-63): due reti esplicite. `mgmt_net` è il Piano di
#   Gestione (postgres, redis, backend con il worker di export, frontend admin,
#   public-site come solo motore di anteprima). `edge_net` è il Piano di
#   Erogazione Pubblica e contiene **solo** `nginx-static`, che legge il volume
#   `static_site` in sola lettura. Il backend lo scrive (push, mai pull).
#   Verificato in CI da `check-air-gap.js`. Ciò che la CI non vede (firewall
#   dell'hosting, porte pubblicate sull'host) va nella checklist di go-live.

name: cms

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_db}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgmt_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgmt_net

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cms_db}
      REDIS_URL: redis://redis:6379
      # Radice dell'export statico: il volume condiviso con `nginx-static`,
      # scritto solo da qui (ADR-63). Il worker chiede l'HTML a public-site.
      STATIC_EXPORT_PATH: /srv/static-site
      PUBLIC_SITE_URL: http://public-site:4000
      EXPORT_RENDER_SECRET: ${EXPORT_RENDER_SECRET:?Imposta EXPORT_RENDER_SECRET in .env}
    volumes:
      - static_site:/srv/static-site
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Solo il lato host è spostato (progetto sempre in parallelo con altri
    # stack sulla stessa macchina, vedi docker-compose.yml): il container
    # continua ad ascoltare su 3000 (PORT sopra, invariata), coerente con
    # EXPOSE/HEALTHCHECK del Dockerfile.
    ports:
      - '53000:3000'
    networks:
      - mgmt_net

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Imposta VITE_API_BASE_URL in .env}
        VITE_PUBLIC_MEDIA_BASE_URL: ${VITE_PUBLIC_MEDIA_BASE_URL:?Imposta VITE_PUBLIC_MEDIA_BASE_URL in .env}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5080:80'
    networks:
      - mgmt_net

  public-site:
    build:
      context: .
      dockerfile: app/public-site/Dockerfile
      args:
        VITE_PUBLIC_MEDIA_BASE_URL: ${VITE_PUBLIC_MEDIA_BASE_URL:?Imposta VITE_PUBLIC_MEDIA_BASE_URL in .env}
    restart: unless-stopped
    environment:
      PORT: 4000
      PUBLIC_API_BASE_URL: http://backend:3000
      # ADR-67: con il segreto configurato le Pagine si rendono solo per il
      # worker di export; il traffico anonimo riceve 404 (ADR-53 § 5).
      EXPORT_RENDER_SECRET: ${EXPORT_RENDER_SECRET:?Imposta EXPORT_RENDER_SECRET in .env}
    depends_on:
      - backend
    # Solo il lato host (stesso motivo del backend sopra): il container resta
    # su 4000 (PORT sopra, invariata).
    ports:
      - '55000:4000'
    networks:
      - mgmt_net

  # Piano di Erogazione Pubblica (ADR-63): solo su `edge_net`, volume in sola
  # lettura, nessuna variabile d'ambiente e nessuna dipendenza da servizi del
  # Piano di Gestione. Serve il sito anche a backend spento.
  nginx-static:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - static_site:/usr/share/nginx/html:ro
      - ./nginx/static-site.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge_net
    ports:
      - '58080:80'

networks:
  mgmt_net:
  edge_net:

volumes:
  pgdata_prod:
  redisdata_prod:
  static_site:
