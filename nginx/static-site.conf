# Piano di Erogazione Pubblica (ADR-53 § 4, ADR-63): serve solo i file scritti
# dal job di export sul volume `static_site`, montato in sola lettura. Nessun
# proxy, nessun upstream: questo processo non conosce backend, database o code.
#
# Layout del volume (ADR-65): il file vive all'URL pubblico canonico,
# `/` → `index.html`, `/en-gb/about` → `en-gb/about/index.html`.

# Contatore delle visite (ADR-68): una riga JSON per ogni richiesta di Pagina,
# in un file per giorno UTC sul volume dei log che il backend legge e svuota.
# Solo i campi che servono alla dashboard; l'IP diventa un hash giornaliero
# alla lettura e il file grezzo è cancellato entro il giorno successivo.
map $time_iso8601 $edge_log_day {
    "~^(?<day>\d{4}-\d{2}-\d{2})" $day;
    default undated;
}

log_format edge_json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"ip":"$remote_addr","ua":"$http_user_agent",'
    '"referer":"$http_referer","purpose":"$http_sec_purpose$http_purpose"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Nessun log per default: asset, redirect e file interni non sono visite,
    # e un IP in più nei log del container sarebbe un dato personale in più.
    access_log off;
    open_log_file_cache max=4 inactive=60s valid=60s;
    disable_symlinks on;
    autoindex off;

    gzip on;
    gzip_types text/plain text/css application/xml image/svg+xml;
    gzip_min_length 1024;

    # Artefatti interni dell'export, mai pubblici: il manifest (pageId,
    # hash di contenuto) e i file temporanei della scrittura atomica.
    location = /manifest.json { return 404; }
    location ~ \.tmp- { return 404; }

    # Forma canonica senza slash finale (ADR-24 § 4).
    location ~ ^(.+)/$ {
        return 308 $1$is_args$args;
    }

    # Bundle CSS con fingerprint nel nome: immutabile (ADR-53 § 2).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Media per guid: stabili ma senza hash di contenuto, quindi cache lunga
    # senza `immutable`.
    location /assets/media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Pagine: HTML sempre rivalidato (ETag), così una ripubblicazione o un
    # tombstone sono visibili subito. Cache invalidata per evento, mai per TTL.
    location / {
        access_log /var/log/edge/access-$edge_log_day.log edge_json;
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
