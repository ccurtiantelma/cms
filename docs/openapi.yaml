    ThemeConfigDto:
      type: object
      properties:
        version:
          type: number
          description: Versione del contratto ThemeConfig
          example: 7
          enum:
            - 7
        navbarWidth:
          type: number
          description: Larghezza sidebar espansa
          example: 210
        navbarWidthUnit:
          type: string
          description: Unità CSS di navbarWidth (v7)
          enum:
            - px
            - em
            - rem
            - '%'
          example: px
        navbarDefaultCollapsed:
          type: boolean
          description: Sidebar chiusa (solo icone) di default al caricamento
          example: false
        navbarEdgeStyle:
          type: string
          description: >-
            Stile del bordo destro della sidebar: bordo sottile o ombra
            proiettata
          enum:
            - border
            - shadow
          example: border
        navbarEdgeShadowIntensity:
          type: number
          description: >-
            Intensità (0–1) dell'ombra del bordo destro sidebar quando
            navbarEdgeStyle è 'shadow'
          example: 0.16
        colors:
          description: I 9 colori semantici del tema
          allOf:
            - $ref: '#/components/schemas/ThemeColorsDto'
        primaryShade:
          description: Shade filled per scheme
          allOf:
            - $ref: '#/components/schemas/ThemePrimaryShadeDto'
        radius:
          type: string
          description: Radius di default dei componenti
          enum:
            - xs
            - sm
            - md
            - lg
            - xl
          example: md
        focusRing:
          type: string
          description: Anello di focus
          enum:
            - auto
            - always
            - never
          example: auto
        cursorType:
          type: string
          description: Cursore sui controlli interattivi
          enum:
            - default
            - pointer
          example: default
        respectReducedMotion:
          type: boolean
          description: Rispetta prefers-reduced-motion
          example: false
        autoContrast:
          type: boolean
          description: Contrasto automatico sui filled
          example: false
        luminanceThreshold:
          type: number
          description: Soglia di luminanza per autoContrast (0–1)
          example: 0.3
        scale:
          type: number
          description: Scala globale interfaccia (0.75–1.5)
          example: 1
        defaultGradient:
          description: Gradiente di default
          allOf:
            - $ref: '#/components/schemas/ThemeGradientDto'
        typography:
          description: Blocco tipografico
          allOf:
            - $ref: '#/components/schemas/ThemeTypographyDto'
        spacing:
          description: Scala di spaziatura xs–xl
          allOf:
            - $ref: '#/components/schemas/ThemeSpacingDto'
        spacingUnit:
          type: string
          description: Unità CSS di spacing (v7)
          enum:
            - px
            - em
            - rem
            - '%'
          example: px
        radiusScale:
          description: Valori dei radius token xs–xl
          allOf:
            - $ref: '#/components/schemas/ThemeRadiusScaleDto'
        radiusScaleUnit:
          type: string
          description: Unità CSS di radiusScale (v7)
          enum:
            - px
            - em
            - rem
            - '%'
          example: px
        shadows:
          description: Ombre xs–xl strutturate
          allOf:
            - $ref: '#/components/schemas/ThemeShadowsDto'
        shadowUnit:
          type: string
          description: Unità CSS di shadows (v7) — solo lunghezze, mai %
          enum:
            - px
            - em
            - rem
          example: px
        components:
          description: Default per-componente
          allOf:
            - $ref: '#/components/schemas/ThemeComponentsDto'
        light:
          description: Token per lo scheme chiaro
          allOf:
            - $ref: '#/components/schemas/ThemeSchemeTokensDto'
        dark:
          description: Token per lo scheme scuro
          allOf:
            - $ref: '#/components/schemas/ThemeSchemeTokensDto'
      required:
        - version
        - navbarWidth
        - navbarWidthUnit
        - navbarDefaultCollapsed
        - navbarEdgeStyle
        - navbarEdgeShadowIntensity
        - colors
        - primaryShade
        - radius
        - focusRing
        - cursorType
        - respectReducedMotion
        - autoContrast
        - luminanceThreshold
        - scale
        - defaultGradient
        - typography
        - spacing
        - spacingUnit
        - radiusScale
        - radiusScaleUnit
        - shadows
        - shadowUnit
        - components
        - light
        - dark
    UploadFileDto:
      type: object
      properties:
        entity:
          type: string
          description: Nome tabella/dominio a cui associare il file
          example: invoice
          maxLength: 100
        entityId:
          type: string
          description: Id/guid dell'entità di dominio da associare
          example: a1b2c3d4e5f6a7b8
          maxLength: 100
    FileMetadataDto:
      type: object
      properties:
        guid:
          type: string
          description: Identificatore pubblico del file, usato nelle URL
          example: a1b2c3d4e5f6a7b8
        originalName:
          type: string
          description: Nome file originale (solo display)
          example: fattura-2026-001.pdf
        mimeType:
          type: string
          description: MIME type dichiarato dal client
          example: application/pdf
        sizeBytes:
          type: number
          description: Dimensione del file in byte
          example: 348213
        entity:
          type: object
          description: Nome tabella/dominio a cui il file è associato, se presente
          example: invoice
          nullable: true
        entityId:
          type: object
          description: Id/guid dell'entità di dominio associata, se presente
          example: a1b2c3d4e5f6a7b8
          nullable: true
        createdAt:
          format: date-time
          type: string
          description: Data di caricamento
          example: '2026-07-23T10:00:00.000Z'
      required:
        - guid
        - originalName
        - mimeType
        - sizeBytes
        - createdAt
    UnreadCountDto:
      type: object
      properties:
        count:
          type: number
          description: Numero di notifiche non lette del chiamante
          example: 3
      required:
        - count
    NotificationDto:
      type: object
      properties:
        guid:
          type: string
          description: Identificatore pubblico della notifica, usato nelle URL
          example: a1b2c3d4e5f6a7b8
        type:
          type: string
          description: Codice tipo libero, definito dal progetto verticale
          example: system.info
        title:
          type: string
          description: Titolo breve
          example: Nuovo documento caricato
        message:
          type: string
          description: Testo del messaggio
          example: Il file "fattura.pdf" è stato caricato con successo.
        link:
          type: object
          description: Percorso frontend su cui portare l'utente al click, se presente
          example: /files
          nullable: true
        isRead:
          type: boolean
          description: Se la notifica è già stata letta
          example: false
        createdAt:
          format: date-time
          type: string
          description: Data di creazione
          example: '2026-07-23T10:00:00.000Z'
      required:
        - guid
        - type
        - title
        - message
        - isRead
        - createdAt
    MarkAllReadDto:
      type: object
      properties:
        updated:
          type: number
          description: Numero di notifiche aggiornate
          example: 3
      required:
        - updated
    PageFaqEntryDto:
      type: object
      properties:
        question:
          type: string
          description: Domanda
        answer:
          type: string
          description: Risposta
    PageSeoDto:
      type: object
      properties:
        metaTitle:
          type: string
          description: Titolo per i motori di ricerca (fallback al titolo Pagina)
        metaDescription:
          type: string
          description: Descrizione per i motori di ricerca
        canonicalUrl:
          type: string
          description: URL canonica (se vuota, calcolata dal percorso della Pagina)
        robotsIndex:
          type: string
          description: Direttiva indicizzazione
          enum:
            - index
            - noindex
        robotsFollow:
          type: string
          description: Direttiva crawling dei link
          enum:
            - follow
            - nofollow
        ogTitle:
          type: string
          description: Titolo Open Graph (fallback a metaTitle)
        ogDescription:
          type: string
          description: Descrizione Open Graph (fallback a metaDescription)
        ogImage:
          type: string
          description: Immagine Open Graph (fallback a immagine di copertina)
        structuredData:
          type: object
          description: JSON-LD esteso a mano, oltre a quello generato dal sistema
        aiSummary:
          type: string
          description: Riassunto sintetico e autosufficiente per i motori generativi
        keyFacts:
          description: Affermazioni brevi e verificabili estratte dalla Pagina
          type: array
          items:
            type: string
        faq:
          description: Coppie domanda/risposta
          type: array
          items:
            $ref: '#/components/schemas/PageFaqEntryDto'
        entities:
          description: Entità/argomenti trattati dalla Pagina
          type: array
          items:
            type: string
        aiPolicyAllowed:
          type: boolean
          description: >-
            Consenso all'uso del contenuto da parte dei crawler AI (default:
            consentito)
    CreatePageDto:
      type: object
      properties:
        title:
          type: string
          description: Titolo della Pagina
          example: Chi siamo
        slug:
          type: string
          description: >-
            Slug proposto (normalizzato server-side); se assente, generato dal
            titolo
          example: chi-siamo
        locale:
          type: string
          description: Locale della Pagina
          example: it-IT
        parentGuid:
          type: string
          description: Guid della Pagina genitore; assente per una Pagina root
          example: a1b2c3d4e5f6a7b8
        draftContent:
          type: object
          description: 'Albero di blocchi iniziale (default: albero vuoto)'
          additionalProperties: true
        draftSeo:
          description: Metadati SEO/GEO iniziali
          allOf:
            - $ref: '#/components/schemas/PageSeoDto'
      required:
        - title
        - locale
    PageDto:
      type: object
      properties:
        guid:
          type: string
          description: Identificatore pubblico della Pagina, usato nelle URL admin
          example: a1b2c3d4e5f6a7b8
        title:
          type: string
          description: Titolo della Pagina
          example: Chi siamo
        slug:
          type: string
          description: Slug, unico per locale + genitore fra le righe attive
          example: chi-siamo
        locale:
          type: string
          description: Locale della Pagina
          example: it-IT
        parentGuid:
          type: object
          description: Guid della Pagina genitore, null per una Pagina root
          nullable: true
        translationGroupId:
          type: string
          description: Chiave opaca del gruppo di traduzione
          example: f6a7b8a1b2c3d4e5
        status:
          type: string
          description: Stato del ciclo di vita
          example: draft
        publishedAt:
          type: object
          description: Data di pubblicazione, se pubblicata
          nullable: true
        scheduledAt:
          type: object
          description: Data di pubblicazione programmata, se impostata
          nullable: true
        draftContent:
          type: object
          description: Albero di blocchi della bozza corrente
          additionalProperties: true
        draftSeo:
          type: object
          description: Metadati SEO/GEO della bozza corrente
          additionalProperties: true
        version:
          type: number
          description: Contatore di lock ottimistico, da inviare in ogni PATCH
          example: 3
        createdAt:
          format: date-time
          type: string
          description: Data di creazione
        updatedAt:
          format: date-time
          type: string
          description: Data di ultimo aggiornamento della bozza
        contentIssues:
          type: array
          description: >-
            Nodi dell'albero blocchi che falliscono migrazione o validazione in
            lettura (mai un'eccezione: il nodo resta esposto come persistito).
            Assente solo dove non calcolato per costo (liste); array vuoto
            quando l'albero è integro.
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              details:
                type: object
                additionalProperties: true
      required:
        - guid
        - title
        - slug
        - locale
        - translationGroupId
        - status
        - draftContent
        - draftSeo
        - version
        - createdAt
        - updatedAt
    UpdatePageDto:
      type: object
      properties:
        version:
          type: number
          description: Version letta al caricamento della bozza (lock ottimistico)
          example: 3
        title:
          type: string
          description: Titolo della Pagina
        slug:
          type: string
          description: >-
            Slug (normalizzato server-side); non rigenerato automaticamente dal
            titolo
        parentGuid:
          type: object
          description: Guid della nuova Pagina genitore; null per spostare in radice
          nullable: true
          example: a1b2c3d4e5f6a7b8
        draftContent:
          type: object
          description: Albero di blocchi aggiornato (sostituisce integralmente la bozza)
          additionalProperties: true
        draftSeo:
          description: >-
            Metadati SEO/GEO aggiornati (sostituiscono integralmente i
            precedenti)
          allOf:
            - $ref: '#/components/schemas/PageSeoDto'
      required:
        - version
    PagePreviewTokenDto:
      type: object
      properties:
        token:
          type: string
          description: >-
            JWT di anteprima, firmato con un segreto dedicato (mai quello di
            access/refresh). Claim: pageGuid, purpose="page-preview", exp a 15
            minuti dall'emissione. Va passato a "GET
            api/v1/preview/pages/:token" (rotta separata, mai app/ o public/).
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresAt:
          format: date-time
          type: string
          description: >-
            Scadenza del token (15 minuti dall'emissione, non rinnovabile:
            nessun refresh).
          example: '2026-08-19T10:15:00.000Z'
      required:
        - token
        - expiresAt
    ChangeStatusDto:
      type: object
      properties:
        status:
          type: string
          description: Stato di destinazione
          enum:
            - draft
            - review
            - scheduled
            - published
            - archived
          example: published
        scheduledAt:
          type: string
          description: >-
            Data/ora futura di pubblicazione programmata, obbligatoria se
            status=scheduled
          example: '2026-09-01T09:00:00.000Z'
      required:
        - status
    PageRevisionDetailDto:
      type: object
      properties:
        guid:
          type: string
          description: Identificatore pubblico della Revisione
          example: b1a2c3d4e5f6a7b8
        revisionNumber:
          type: number
          description: Progressivo della Revisione per questa Pagina
          example: 3
        title:
          type: string
          description: Titolo al momento dello snapshot
          example: Chi siamo
        slug:
          type: string
          description: Slug al momento dello snapshot
          example: chi-siamo
        createdAt:
          format: date-time
          type: string
          description: Data di creazione della Revisione (= data di pubblicazione)
        authorName:
          type: string
          description: >-
            Nome e cognome di chi ha pubblicato questa Revisione
            (business-rules.md § Revisioni, regola 1)
          example: Maria Rossi
        content:
          type: object
          description: >-
            Albero di blocchi al momento della pubblicazione (snapshot
            immutabile)
          additionalProperties: true
        seo:
          type: object
          description: >-
            Metadati SEO/GEO al momento della pubblicazione (snapshot
            immutabile)
          additionalProperties: true
        contentIssues:
          type: array
          description: >-
            Nodi dell'albero blocchi che falliscono migrazione o validazione in
            lettura (mai un'eccezione: il nodo resta esposto come persistito,
            mai migrato a metà). Array vuoto quando l'albero è integro
            (SPEC-F02-blocchi.md § 4.3).
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              details:
                type: object
                additionalProperties: true
      required:
        - guid
        - revisionNumber
        - title
        - slug
        - createdAt
        - authorName
        - content
        - seo
        - contentIssues
    PublicPageDto:
      type: object
      properties:
        title:
          type: string
          description: Titolo della Pagina, snapshot della Revisione pubblicata
          example: Chi siamo
        slug:
          type: string
          description: >-
            Slug dell'ultimo segmento del percorso, snapshot della Revisione
            pubblicata
          example: chi-siamo
        locale:
          type: string
          description: Locale della Pagina risolta
          example: it-IT
        content:
          type: object
          description: >-
            Albero di blocchi della Revisione pubblicata, già migrato alla forma
            corrente ({version, blocks})
          additionalProperties: true
        seo:
          type: object
          description: Metadati SEO/GEO della Revisione pubblicata
          additionalProperties: true
      required:
        - title
        - slug
        - locale
        - content
        - seo
    PagePreviewContentDto:
      type: object
      properties:
        title:
          type: string
          description: Titolo della Pagina, snapshot della bozza corrente
          example: Chi siamo (bozza)
        slug:
          type: string
          description: >-
            Slug dell'ultimo segmento del percorso, snapshot della bozza
            corrente
          example: chi-siamo
        locale:
          type: string
          description: Locale della Pagina
          example: it-IT
        content:
          type: object
          description: >-
            Albero di blocchi della bozza corrente, già migrato alla forma
            corrente ({version, blocks})
          additionalProperties: true
        seo:
          type: object
          description: Metadati SEO/GEO della bozza corrente
          additionalProperties: true
      required:
        - title
        - slug
        - locale
        - content
        - seo
