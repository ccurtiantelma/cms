# Config nginx per servire la SPA React (Vite build) in produzione.
# Nessun proxy verso il backend: il frontend chiama l'API direttamente su
# VITE_API_BASE_URL (baked a build-time), CORS gestito lato NestJS
# (app.enableCors, FRONTEND_URL — vedi main.ts).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Asset con hash nel nome (build Vite) — cache lunga e immutabile.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: qualsiasi rotta non-file torna su index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
